
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bikaner Express Delivery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff8ed;
      color: #382417;
      margin: 0;
      padding: 16px;
    }
    .card {
      max-width: 480px;
      margin: 25px auto;
      padding: 20px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 16px #0001;
    }
    h1 { color: #a94313; }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 12px;
      font-size: 16px;
      border-radius: 8px;
    }
    input { border: 1px solid #d8c8b8; }
    button {
      background: #a94313;
      color: white;
      border: 0;
      font-weight: bold;
    }
    .secondary { background: #604832; }
    #message { overflow-wrap: anywhere; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🛵 Bikaner Express</h1>
    <p>Delivery Partner Portal</p>
    <p id="message" role="status">लोड हो रहा है...</p>

    <div id="authPanel" style="display:none">
      <button id="showLogin" type="button">Delivery Boy Login</button>
      <button id="showSignup" class="secondary" type="button">नया Signup</button>

      <form id="loginForm" style="display:none">
        <h2>Login</h2>
        <input id="loginEmail" type="email" placeholder="Email" required>
        <input id="loginPassword" type="password" placeholder="Password" required>
        <button type="submit">Login करें</button>
      </form>

      <form id="signupForm" style="display:none">
        <h2>नया अकाउंट बनाएँ</h2>
        <input id="name" type="text" placeholder="पूरा नाम" required>
        <input id="phone" type="tel" placeholder="10 अंकों का मोबाइल नंबर"
          pattern="[0-9]{10}" maxlength="10" required>
        <input id="signupEmail" type="email" placeholder="Email" required>
        <input id="signupPassword" type="password"
          placeholder="कम से कम 8 अक्षर का Password" minlength="8" required>
        <button type="submit">Signup करें</button>
      </form>
    </div>

    <div id="deliveryDashboard" style="display:none">
      <h2>Delivery Dashboard</h2>
      <p id="boyDetails"></p>
      <p>आपका अकाउंट Approved है। ✅</p>
      <div id="assignedOrdersBox">
  <h3>मेरे असाइन किए गए ऑर्डर</h3>
  <p>अभी कोई ऑर्डर असाइन नहीं किया गया है।</p>
</div>
      <button id="logoutButton" type="button">Logout</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDhumnH7lRnz_LVJLTMklksusBPaDAkCh4",
      authDomain: "bikaner-express-537a2.firebaseapp.com",
      databaseURL: "https://bikaner-express-537a2-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "bikaner-express-537a2",
      storageBucket: "bikaner-express-537a2.firebasestorage.app",
      messagingSenderId: "852964791053",
      appId: "1:852964791053:web:94c129e58b72a375661644"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.database();

    const message = document.getElementById("message");
    const authPanel = document.getElementById("authPanel");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const dashboard = document.getElementById("deliveryDashboard");

    function showLogin() {
      loginForm.style.display = "block";
      signupForm.style.display = "none";
      message.textContent = "अपने Delivery Boy अकाउंट से Login करें।";
    }

    function showSignup() {
      signupForm.style.display = "block";
      loginForm.style.display = "none";
      message.textContent = "नया Delivery Boy अकाउंट बनाएँ।";
    }

    document.getElementById("showLogin").onclick = showLogin;
    document.getElementById("showSignup").onclick = showSignup;

    async function checkDeliveryBoy(user) {
      authPanel.style.display = "none";
      dashboard.style.display = "none";
      message.textContent = "आपका अकाउंट चेक हो रहा है...";

      try {
        const snapshot = await db.ref("deliveryBoys/" + user.uid).once("value");

        if (!snapshot.exists()) {
          message.textContent =
            "Delivery Boy प्रोफ़ाइल नहीं मिली। Admin से संपर्क करें।";
          await auth.signOut();
          return;
        }

        const boy = snapshot.val();

        if (boy.status !== "approved") {
          message.textContent =
            "आपका अकाउंट अभी मंज़ूर नहीं हुआ है। Admin की मंज़ूरी का इंतज़ार करें।";
          return;
        }

        dashboard.style.display = "block";
        message.textContent = "Login सफल!";
        const assignedOrdersBox = document.getElementById("assignedOrdersBox");

if (assignedOrdersBox) {
  assignedOrdersBox.innerHTML = "<h3>मेरे असाइन किए गए ऑर्डर</h3><p>ऑर्डर लोड हो रहे हैं...</p>";

  try {
    const ordersSnapshot = await db.ref("assignedOrders/" + user.uid).once("value");

    assignedOrdersBox.innerHTML = "<h3>मेरे असाइन किए गए ऑर्डर</h3>";

    if (!ordersSnapshot.exists()) {
      assignedOrdersBox.innerHTML += "<p>अभी कोई ऑर्डर असाइन नहीं किया गया है।</p>";
    } else {
      ordersSnapshot.forEach(function(child) {
        const order = child.val();
        const card = document.createElement("div");

        card.style.cssText = "border:1px solid #ccc;padding:12px;margin:10px 0;border-radius:8px;";
        card.innerHTML =
          "<b>ऑर्डर:</b> " + (order.orderId || child.key) +
          "<br><b>ग्राहक:</b> " + (order.name || "-") +
          "<br><b>मोबाइल:</b> " + (order.phone || "-") +
          "<br><b>पता:</b> " + (order.address || "-") +
          "<br><b>कुल:</b> ₹" + (order.total || 0) +
          "<br><b>स्थिति:</b> " + (order.status || "Assigned");
const statusSelect = document.createElement("select");

["Accepted", "Out for Delivery", "Delivered"].forEach(function(status) {
  const option = document.createElement("option");
  option.value = status;
  option.textContent = status;
  if (order.status === status) {
    option.selected = true;
  }
  statusSelect.appendChild(option);
});

const updateButton = document.createElement("button");
updateButton.type = "button";
updateButton.textContent = "Status Update";

updateButton.addEventListener("click", async function() {
  updateButton.disabled = true;
  updateButton.textContent = "Update हो रहा है...";

  try {
    await db.ref("assignedOrders/" + user.uid + "/" + child.key)
      .update({
        status: statusSelect.value,
        updatedAt: Date.now()
      });

    order.status = statusSelect.value;
    card.innerHTML =
      "<b>ऑर्डर:</b> " + (order.orderId || child.key) +
      "<br><b>ग्राहक:</b> " + (order.name || "-") +
      "<br><b>मोबाइल:</b> " + (order.phone || "-") +
      "<br><b>पता:</b> " + (order.address || "-") +
      "<br><b>कुल:</b> ₹" + (order.total || 0) +
      "<br><b>स्थिति:</b> " + order.status;

    card.appendChild(statusSelect);
    card.appendChild(updateButton);
    updateButton.textContent = "Updated ✓";
  } catch (error) {
    console.error(error);
    alert("Error: " + error.code + " - " + error.message);
    updateButton.disabled = false;
    updateButton.textContent = "Status Update";
  }
});

card.appendChild(statusSelect);
card.appendChild(updateButton);
        assignedOrdersBox.appendChild(card);
      });
    }
  } catch (error) {
    console.error(error);
    assignedOrdersBox.innerHTML = "<h3>मेरे असाइन किए गए ऑर्डर</h3><p>ऑर्डर लोड नहीं हुए। इंटरनेट या Firebase Rules जाँचें।</p>";
  }
}
        message.textContent = "Login सफल!";
        document.getElementById("boyDetails").textContent =
          "नाम: " + (boy.name || "-") +
          "\nमोबाइल: " + (boy.phone || "-");

      } catch (error) {
        console.error(error);
        message.textContent =
          "अकाउंट चेक नहीं हो पाया। इंटरनेट और Firebase Rules जाँचें।";
      }
    }

    auth.onAuthStateChanged(async user => {
      if (user) {
        await checkDeliveryBoy(user);
      } else {
        dashboard.style.display = "none";
        authPanel.style.display = "block";
        showLogin();
      }
    });

    loginForm.addEventListener("submit", async event => {
      event.preventDefault();
      message.textContent = "Login हो रहा है...";

      try {
        await auth.signInWithEmailAndPassword(
          document.getElementById("loginEmail").value.trim(),
          document.getElementById("loginPassword").value
        );
      } catch (error) {
        console.error(error);
        message.textContent =
          "Login नहीं हुआ। Email और Password जाँचें।";
      }
    });

    signupForm.addEventListener("submit", async event => {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value;

      if (!/^[0-9]{10}$/.test(phone)) {
        message.textContent = "सही 10 अंकों का मोबाइल नंबर डालें।";
        return;
      }

      message.textContent = "Signup हो रहा है...";

      try {
        const result = await auth.createUserWithEmailAndPassword(email, password);

        await db.ref("deliveryBoys/" + result.user.uid).set({
          name: name,
          phone: phone,
          email: email,
          status: "pending",
          createdAt: Date.now()
        });

        message.textContent =
          "Signup सफल! Admin की मंज़ूरी का इंतज़ार करें।";
        signupForm.reset();

      } catch (error) {
        console.error(error);
        message.textContent =
          error.code === "auth/email-already-in-use"
            ? "यह Email पहले से रजिस्टर है। Login करें।"
            : "Signup पूरा नहीं हुआ। इंटरनेट और Firebase Rules जाँचें।";
      }
    });

    document.getElementById("logoutButton").onclick = async () => {
      await auth.signOut();
      message.textContent = "आप Logout हो गए हैं।";
    };
  </script>
</body>
</html>
